<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found | Kennedy Executive Travel</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --black:#0c0b0b;
  --red:#9e1c1c;
  --red-lt:#c42222;
  --gold:#c8a45a;
  --gold-lt:#dfc07a;
  --cream:#f0ebe0;
  --mid:#7a6f6f;
  --border-red:rgba(158,28,28,0.25);
}
body{background:var(--black);color:var(--cream);font-family:'Jost',sans-serif;font-weight:300;min-height:100vh;display:flex;flex-direction:column}

/* NAV */
nav{display:flex;align-items:center;justify-content:space-between;padding:0 3rem;height:64px;border-bottom:1px solid var(--border-red)}
.nav-logo-img{height:40px;width:auto;display:block}
.nav-phone{font-size:0.78rem;letter-spacing:0.06em;color:var(--gold);text-decoration:none}

/* CONTENT */
.notfound{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:3rem;position:relative;overflow:hidden}
.notfound-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:22vw;font-weight:300;color:rgba(158,28,28,0.06);pointer-events:none;line-height:1}
.eyebrow{font-size:0.62rem;letter-spacing:0.3em;text-transform:uppercase;color:var(--red-lt);margin-bottom:1.5rem;position:relative;z-index:2}
.notfound-title{font-family:'Dancing Script',cursive;font-weight:600;font-size:clamp(2.5rem,5vw,4rem);color:var(--cream);margin-bottom:1.5rem;position:relative;z-index:2}
.notfound-text{font-size:0.9rem;color:var(--mid);line-height:1.95;max-width:440px;margin-bottom:2.5rem;position:relative;z-index:2}
.notfound-actions{display:flex;gap:1.2rem;flex-wrap:wrap;justify-content:center;position:relative;z-index:2}
.btn-red{font-size:0.7rem;letter-spacing:0.18em;text-transform:uppercase;background:var(--red);color:var(--cream);padding:0.9rem 2.5rem;text-decoration:none;display:inline-block;transition:background 0.2s}
.btn-red:hover{background:var(--red-lt)}
.btn-outline-gold{font-size:0.7rem;letter-spacing:0.18em;text-transform:uppercase;border:0.5px solid var(--gold);color:var(--gold);padding:0.9rem 2.5rem;text-decoration:none;display:inline-block;transition:all 0.2s}
.btn-outline-gold:hover{background:rgba(200,164,90,0.07)}

@media(max-width:600px){
  nav{padding:0 1.5rem}
}
</style>
</head>
<body>

<nav>
  <a href="index.html"><img src="assets/images/logo.png" alt="Kennedy Executive Travel" class="nav-logo-img"></a>
  <a href="tel:07961834904" class="nav-phone">07961 834 904</a>
</nav>

<div class="notfound">
  <div class="notfound-bg">404</div>
  <p class="eyebrow">Wrong turn</p>
  <h1 class="notfound-title">This road doesn't<br>go anywhere.</h1>
  <p class="notfound-text">The page you're looking for doesn't exist — but we can still get you where you need to go. Head back to the homepage, or browse the fleet.</p>
  <div class="notfound-actions">
    <a href="index.html" class="btn-red">Back to home</a>
    <a href="fleet.html" class="btn-outline-gold">View the fleet</a>
  </div>
</div>

</body>
</html>
